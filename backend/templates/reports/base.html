<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Cleaning Proof{% endblock %}</title>
  <style>
    :root { --brand: {{ brand|default:"#0F766E" }}; --ink: #1f2933; --muted: #616e7c; --line: #e4e7eb;
            --bg: #f5f7f7; --card: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: var(--ink); background: var(--bg); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 4px 0; } h2 { font-size: 17px; margin: 0 0 10px; color: var(--brand); }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: var(--ok); } .badge.warn { background: #fef3c7; color: var(--warn); }
    .badge.bad { background: #fee2e2; color: var(--bad); }
    ul.tasks { list-style: none; padding: 0; margin: 0 0 10px; }
    ul.tasks li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
    .mark { width: 20px; text-align: center; font-weight: 700; }
    .mark.done { color: var(--ok); } .mark.skipped { color: var(--warn); } .mark.pending { color: var(--bad); }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .photos figure { margin: 0; } .photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #eee; }
    .photos figcaption { font-size: 12px; color: var(--muted); }
    .issue { border-left: 3px solid var(--warn); padding: 4px 0 4px 12px; margin-bottom: 12px; }
    input, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    button, .btn { background: var(--brand); color: #fff; border: 0; padding: 10px 16px; border-radius: 8px;
                   font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn.secondary { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
    canvas { width: 100%; height: 160px; border: 1px dashed var(--line); border-radius: 8px; touch-action: none; background: #fff; }
    details summary { cursor: pointer; color: var(--brand); font-weight: 600; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0 30px; }
    footer a { color: inherit; } .mono { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
    .notice { padding: 10px 14px; border-radius: 8px; background: #ecfdf5; color: var(--ok); margin-bottom: 14px; }
  </style>
</head>
<body><div class="wrap">{% block content %}{% endblock %}
<footer>Powered by <a href="https://cleaningproof.app" rel="noopener">Cleaning Proof</a></footer>
</div></body>
</html>
