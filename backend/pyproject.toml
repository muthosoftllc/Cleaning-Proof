[project]
name = "cleaningproof-backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear: likely bugs
    "S",             # bandit: security
    "UP",            # modern syntax
    "DJ",            # Django pitfalls
    "C4", "SIM", "RET", "PIE", "PERF",
]
ignore = [
    "S101",    # assert is fine in tests
    "RET505",  # else-after-return reads clearer in validation chains
    "SIM105",
    "DJ001",   # blank CharFields are deliberate (no NULL/'' ambiguity)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]  # test passwords/tokens/tmp paths

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
