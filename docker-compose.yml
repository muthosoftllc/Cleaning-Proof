# Local/production-like stack: Postgres + API + scheduler.
#   cp backend/.env.example backend/.env   (set DJANGO_DEBUG=1 for local use)
#   docker compose up --build
#   docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cleaningproof
      POSTGRES_USER: cleaningproof
      POSTGRES_PASSWORD: cleaningproof
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleaningproof"]
      interval: 5s
      retries: 10

  web:
    build: ./backend
    env_file: ./backend/.env
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }

  # Recurring jobs + reminders. Swap for Celery beat once there is a queue.
  scheduler:
    build: ./backend
    env_file: ./backend/.env
    command: >
      sh -c "while true; do
        python manage.py generate_recurring_jobs;
        python manage.py send_job_reminders;
        sleep 300;
      done"
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  media:
