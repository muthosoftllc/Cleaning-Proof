name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cleaningproof
          POSTGRES_USER: cleaningproof
          POSTGRES_PASSWORD: cleaningproof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cleaningproof" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      # Tests must run on PostgreSQL: SQLite silently ignores row locks
      # (SELECT ... FOR UPDATE) and other production behaviour.
      DATABASE_URL: postgres://cleaningproof:cleaningproof@localhost:5432/cleaningproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (incl. bandit security rules)
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          DJANGO_HSTS_PRELOAD: "1"
      - run: python manage.py test --parallel

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Android lint (report only until the baseline is clean)
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true
